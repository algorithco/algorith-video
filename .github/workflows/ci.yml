name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop source and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Unit tests use local mock servers and synthetic media, never provider accounts.
      AWS_EC2_METADATA_DISABLED: 'true'
      ALGORITHVIDEO_WORK_ROOT: ${{ github.workspace }}/.ci-work/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.lock

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify npm dependency lockfile
        run: node scripts/check-lockfile-integrity.cjs

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install locked bridge dependencies
        run: python -m pip install --require-hashes -r engine/requirements.lock

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and bridge tests
        run: npm test

      - name: Build desktop source
        run: npm run build

  engine:
    name: Python engine regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      ALGORITHVIDEO_WORK_ROOT: ${{ github.workspace }}/.ci-work/engine
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/requirements.lock
            scripts/python-tools/pytest.lock

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install locked engine and test dependencies
        run: |
          python -m pip install --require-hashes -r engine/requirements.lock
          python -m pip install --require-hashes -r scripts/python-tools/pytest.lock

      - name: Run engine regression tests
        run: python -m pytest engine/tests -q --timeout=120

# Installer acceptance and interactive Electron end-to-end tests are separate
# checks; this workflow builds source and exercises mocked provider integrations.
