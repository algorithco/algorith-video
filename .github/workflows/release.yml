name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v{package version} after all native builds pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Identify immutable release source
        id: identity
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const version = require('./package.json').version
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid desktop version')
          if (!fs.existsSync(`docs/releases/v${version}.md`)) throw new Error('Missing versioned release notes')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\nsha=${process.env.GITHUB_SHA}\n`)
          JS
      - run: node scripts/check-lockfile-integrity.cjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Release contract regressions
        run: node --test tests/main/brand.test.cjs scripts/release-artifacts.test.cjs scripts/desktop-release.test.cjs

  sources:
    name: Preserve corresponding media sources
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore pinned media source bundle
        id: source-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: media-sources
          key: media-sources-v1-${{ hashFiles('scripts/release/runtime-lock.json', 'scripts/release/stage-media-sources.py') }}
      - name: Download pinned FFmpeg and dependency sources
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: python scripts/release/stage-media-sources.py --output media-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-sources
          path: media-sources/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build:
    name: Native ${{ matrix.id }}
    needs: [prepare, sources]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            platform: windows
            arch: x64
            builder: --win --x64
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            builder: --linux --x64
          - id: mac-arm64
            runner: macos-15
            platform: macos
            arch: arm64
            builder: --mac --arm64
          - id: mac-x64
            runner: macos-15-intel
            platform: macos
            arch: x64
            builder: --mac --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
      SOURCE_SHA: ${{ github.sha }}
      ALGORITHVIDEO_WORK_ROOT: ${{ github.workspace }}/.ci-work/release
      ALGORITHVIDEO_MEDIA_SOURCES_DIR: ${{ github.workspace }}/media-sources
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Linux native tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends patchelf libfuse2t64 xvfb
      - name: macOS native tools
        if: matrix.platform == 'macos'
        run: |
          brew install pkg-config libass nasm
          # Source archives must match every copied caption library, including
          # satisfied dependencies left over from the runner image.
          caption_formulae=(libass)
          while IFS= read -r formula; do
            [[ -n "$formula" ]] && caption_formulae+=("$formula")
          done < <(brew deps --installed --formula libass)
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_INSTALL_CLEANUP=1 \
            brew upgrade --formula "${caption_formulae[@]}"
      - run: npm ci
      - name: Get verified corresponding sources
        if: matrix.platform != 'macos'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: media-sources
          path: media-sources
      - name: Stage Windows or Linux runtime
        if: matrix.platform != 'macos'
        run: python scripts/release/stage-runtime.py
      - name: Stage native macOS runtime
        if: matrix.platform == 'macos'
        run: |
          bash scripts/prepare-resources.sh '${{ matrix.arch }}'
          bash scripts/release/stage-mac-sources.sh '${{ matrix.arch }}'
      - name: Compile desktop application
        run: npm run build
      - name: Build native installers
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
      - name: Find packaged resources
        id: paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          target = '${{ matrix.platform }}'
          if target == 'macos':
              apps = list(Path('dist').glob('mac*/AlgorithVideo.app'))
              if len(apps) != 1:
                  raise SystemExit('Expected one native macOS app')
              app = apps[0]
              resources = app / 'Contents/Resources'
          else:
              app = Path('dist') / ('win-unpacked' if target == 'windows' else 'linux-unpacked')
              resources = app / 'resources'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'app={app.as_posix()}\nresources={resources.as_posix()}\n')
          PY
      - name: Verify relocatable packaged engine and media tools
        run: python scripts/release/verify-runtime.py '${{ steps.paths.outputs.resources }}'
      - name: Check macOS libraries, architecture and Electron fuses
        if: matrix.platform == 'macos'
        run: bash scripts/verify-packaged-mac.sh '${{ steps.paths.outputs.app }}' '${{ matrix.arch }}'
      - name: Packaged Windows and macOS GUI acceptance
        if: matrix.platform != 'linux'
        run: node scripts/release/smoke-desktop.cjs '${{ steps.paths.outputs.app }}' '${{ matrix.id }}'
      - name: Packaged Linux GUI acceptance
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/release/smoke-desktop.cjs '${{ steps.paths.outputs.app }}' '${{ matrix.id }}'
      - name: Produce dependency inventories
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > 'dist/node-sbom-${{ matrix.id }}.json'
          python - <<'PY'
          import subprocess
          from pathlib import Path
          resources = Path('${{ steps.paths.outputs.resources }}')
          python = resources / 'engine-venv' / ('python.exe' if '${{ matrix.platform }}' == 'windows' else 'bin/python3')
          inventory = subprocess.check_output([str(python), '-m', 'pip', 'list', '--format=json'])
          Path('dist/python-packages-${{ matrix.id }}.json').write_bytes(inventory)
          PY
      - name: Stage native release assets
        run: node scripts/release/stage-release-assets.cjs '${{ matrix.id }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified desktop release
    needs: [prepare, sources, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-inputs
      - name: Validate complete release and generate SHA256 sums
        run: node scripts/release/collect-desktop-release.cjs release-inputs publish "$RELEASE_VERSION" "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-desktop-release
          path: publish/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload complete draft and publish
        if: inputs.publish
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" publish/* --target "$SOURCE_SHA" --title "AlgorithVideo $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
